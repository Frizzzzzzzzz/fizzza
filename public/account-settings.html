<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/account-settings.css">
    <title>account-settings</title>
</head>
<body>
    <main>
        <header>
            <div class="schedule">Мы работаем 24 на 7</div>
            <nav class="navigator">
                
                <img class="logo" src="assets/Group 50.png" alt="">
           
               <div class="btns-cont-1">
                <button class="main-btn" onclick="window.location.href='/main.html'">Главная</button>
                    <button class="menu-btn" onclick="window.location.href='/menu.html'">Меню</button> 
                    <button class="contact-btn" onclick="window.location.href='/main.html'">Каталог</button>
               </div>
               <div class="btns-cont-2">
                <button class="search-btn"><img src="assets/akar-icons_search.png" alt=""></button>
                <button class="wishlist-btn"><img src="assets/Group 2.png" alt=""></button>
                <button class="sign-in-btn"><img src="assets/carbon_login.png" alt="">Войти</button>
               </div>
            </nav>
        </header>
        <section class="content-container">
            <aside>
                <div class="twobuttons">
                    <button class="history"><img src="../public/assets/activity.svg" alt="">Мои заказы</button>
                    <button class="settings"><img src="../public/assets/setting-2.svg" alt="">Настройки</button>
                </div>
                <button class="logout"><img src="../public/assets/logout.svg" alt="">Выйти из аккаунта</button>
            </aside>
            <div class="main-content">
                <div class="content-head">
                    <h2 class="content-head-h2">Настройки аккаунта</h2>
                    <hr>
                </div>
                <div class="add-photo">
                    <p>Добавить своё фото</p>
                    <button><img src="" alt=""></button>
                </div>
                <hr>
                <div class="textareas-cont">
                    <div class="textareas-line1">
                        <div class="textarea-p">
                            <p>Имя фамилия</p>
                            <textarea name="" id="" placeholder="Напишите ваше полное имя" required></textarea>
                        </div> 
                        <div class="textarea-p">
                            <p>Почту</p>
                            <textarea name="" id="" placeholder="Напишите вашу почту" required></textarea>
                        </div>
                    </div>
                    <div class="textareas-line2">
                        <div class="textarea-p">
                            <p>Ваш никнейм</p>
                            <textarea name="" id="" placeholder="Напишите ваш никнейм" required></textarea>
                        </div>
                        <div class="textarea-p phonenumer-textarea">
                            <p>Номер телефона</p>
                            <textarea name="" id="" placeholder="Напишите ваш номер телефона"></textarea>
                        </div>
                    </div>
                </div>
                 <div class="content-buttons">
                    <button class="save-btn">Сохранить</button>
                    <button class="back-btn">Назад</button>
                 </div>
            </div>
        </section>
    </main>
</body>
</html>
