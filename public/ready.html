<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/ready.css">
    <title>FizzaPizza/ready</title>
</head>
<body>
    <main>
        <section>
            <h1>Ваш выбор:</h1>
            <div class="txt">
                <p class="p1">Набор пицца 12 шт. <span>7000 руб.</span></p>
                <div class="sos">
                    <p>Мясная 2 шт.</p>
                    <p>Карбонара 3 шт.</p>
                    <p>Гавайская 1 шт.</p>
                    <p>Маргарита 4 шт.</p>
                </div>
                <p class="p1">Упаковка <span>50 руб.</span></p>
                <p class="p1">Открытка с пожеланием <span>30 руб.</span></p>
                <p class="p2">Итого: <span>780 руб.</span></p>
            </div>
            <div class="btns">
                <button class="in-basket">Добавить в корзину</button>
                <button class="confirm">Оформить сейчас</button>
            </div>
        </section>
    </main>
</body>
</html>
